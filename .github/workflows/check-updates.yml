name: Check for updates

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for newer release assets
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_MB: '150'
        run: python3 tools/update_all.py --write && python3 tools/vitadb_updates.py --write

      - name: Open a pull request
        if: steps.check.outputs.count != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/updates
          title: 'Catalogue updates: ${{ steps.check.outputs.count }} entries'
          body-path: update_report.md
          commit-message: 'Update ${{ steps.check.outputs.count }} entries from upstream releases'
          delete-branch: true
          add-paths: |
            apps.json
            psp_apps.json
            preserved/*.json
            icons/*.png

      - name: Copy mirrored files to VitaDBtoo
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MIRROR_COPY_TOKEN }}
        run: python3 tools/copy_mirror.py
