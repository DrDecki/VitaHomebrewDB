name: Rebuild derived files

on:
  push:
    branches: [main]
    paths:
      - 'apps.json'
      - 'psp_apps.json'
      - 'preserved/**'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and commit
        run: |
          python3 build_db.py
          python3 stats.py
          python3 mkwanted.py
          python3 mkindex.py
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m 'Rebuild derived files'
          git pull --rebase -q
          git push -q
